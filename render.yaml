# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: taipei-bus-live
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
