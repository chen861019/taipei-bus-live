<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8fafc">
  <title>台北公車 Live</title>
  <meta name="description" content="只顯示台北公車即時位置的輕量地圖。">
  <link rel="stylesheet" href="/vendor/maplibre-gl.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#map">跳到地圖</a>
  <main class="app-shell" id="appShell" data-sheet-open="false">
    <p class="sr-only" id="mapHelp">可縮放與拖曳地圖；選取公車標記可查看車牌、方向與官方回報時間。</p>
    <div id="map" role="region" aria-label="台北公車即時地圖" aria-describedby="mapHelp"></div>

    <header class="top-card" aria-label="地圖控制">
      <div class="brand-row">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M6 3h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-1l1.5 2h-2.4l-1.5-2H9.4l-1.5 2H5.5L7 19H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm0 3v7h12V6H6Zm2 9.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Zm8 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Z"/></svg>
        </div>
        <div class="brand-copy">
          <h1>台北公車 <span>LIVE</span></h1>
          <div class="live-status" id="liveStatus" data-state="loading" role="status" aria-live="polite" aria-atomic="true">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="statusText">正在取得即時車況…</span>
          </div>
        </div>
        <button class="icon-button" id="refreshButton" type="button" aria-label="更新公車位置" title="更新公車位置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.1 7A8 8 0 1 0 20 14h-2.1A6 6 0 1 1 16.7 8H13v2h7V3h-2v2.5A8 8 0 0 0 19.1 7Z"/></svg>
        </button>
      </div>

      <label class="search-field" for="searchInput">
        <span class="search-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m21 19.6-4.7-4.7a7.5 7.5 0 1 0-1.4 1.4l4.7 4.7 1.4-1.4ZM5 10.5a5.5 5.5 0 1 1 11 0 5.5 5.5 0 0 1-11 0Z"/></svg></span>
        <span class="sr-only">搜尋路線或車牌</span>
        <input id="searchInput" type="search" placeholder="搜尋路線或車牌，例如 307" autocomplete="off">
      </label>

      <div class="summary-row" aria-label="即時統計">
        <div><strong id="busCount">—</strong><span>營運車輛</span></div>
        <div><strong id="routeCount">—</strong><span>目前路線</span></div>
        <div><strong id="updatedTime">—</strong><span>官方資料</span></div>
      </div>
      <div class="filter-status" id="filterStatus" role="status" aria-live="polite" aria-atomic="true" hidden>
        <span id="filterText"></span>
        <button id="clearSearchButton" type="button">清除</button>
      </div>
    </header>

    <div class="map-actions">
      <button class="map-action" id="locateButton" type="button" aria-label="移動到我的位置" title="移動到我的位置">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 2h2v2.1A8 8 0 0 1 19.9 11H22v2h-2.1a8 8 0 0 1-6.9 6.9V22h-2v-2.1A8 8 0 0 1 4.1 13H2v-2h2.1A8 8 0 0 1 11 4.1V2Zm1 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12Zm0 3a3 3 0 1 1 0 6 3 3 0 0 1 0-6Z"/></svg>
      </button>
    </div>

    <section class="bus-sheet" id="busSheet" aria-labelledby="busTitle" hidden>
      <div class="sheet-handle" aria-hidden="true"></div>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="關閉車輛資訊">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.7 5.3 5.3 5.3 5.3-5.3 1.4 1.4-5.3 5.3 5.3 5.3-1.4 1.4-5.3-5.3-5.3 5.3-1.4-1.4 5.3-5.3-5.3-5.3 1.4-1.4Z"/></svg>
      </button>
      <div class="bus-identity">
        <div class="route-badge" id="busRoute">—</div>
        <span class="motion-status" id="busMotionStatus" data-tone="neutral">位置推估</span>
      </div>
      <div class="sheet-copy">
        <h2 id="busTitle">公車資訊</h2>
        <p id="busDestination">方向資料未提供</p>
      </div>
      <dl class="bus-facts">
        <div><dt>車牌</dt><dd id="busPlate">—</dd></div>
        <div><dt>官方速度</dt><dd id="busSpeed">—</dd></div>
        <div><dt>業者</dt><dd id="busOperator">—</dd></div>
        <div><dt>車輛回報</dt><dd><span id="busUpdated">—</span><small id="busAge">—</small></dd></div>
        <div class="wide"><dt>位置狀態</dt><dd id="busMotionDetail">—</dd></div>
        <div class="wide"><dt>系統檢查</dt><dd id="busChecked">—</dd></div>
      </dl>
      <div class="route-stops-panel" id="routeStopsPanel" aria-live="polite" aria-atomic="true" aria-busy="false">
        <div>
          <strong>路線站牌</strong>
          <span id="routeStopsStatus">選取公車後載入該方向站牌</span>
        </div>
        <button id="fitRouteButton" type="button" hidden>顯示全線</button>
      </div>
      <p class="source-note">移動位置會優先沿官方路線做短時間平滑推估；這是估算位置，實際乘車請以官方回報、站牌與業者資訊為準。</p>
    </section>

    <footer class="attribution-note">資料來源：臺北市政府交通局公共運輸處</footer>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
